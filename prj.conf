# Tyre sensor firmware configuration
#
# nRF52810 has ONLY 24 KB RAM. A Zephyr + Bluetooth peripheral build is
# already near the ceiling, so this file is deliberately minimal.
# Logging is DISABLED here: it costs a buffer plus a thread stack, and we
# do not have the headroom. Re-enable it later if RAM allows.

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TYRE_SENSOR"

# Only ever one connection
CONFIG_BT_MAX_CONN=1

# --- I2C ---
CONFIG_I2C=y

# --- No logging: frees several KB of RAM ---
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y

# --- Compiler: favour size ---
CONFIG_SIZE_OPTIMIZATIONS=y

# --- Turn off features we do not use, to save RAM and flash ---
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_BONDABLE=n
CONFIG_SETTINGS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_NVS=n
CONFIG_ASSERT=n

# --- Small thread stacks ---
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
